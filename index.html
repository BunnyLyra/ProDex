<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Коллекция">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Моя коллекция TCGP</title>
<style>
:root{--bg:#f3f1fa;--sf:#fff;--tx:#1f1b33;--mt:#6f6a85;--ac:#5b3fd6;--ln:#ddd8ee;--ok:#2a9d6a;color-scheme:light;
box-sizing:border-box;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
@media(prefers-color-scheme:dark){:root{--bg:#14112a;--sf:#201c3d;--tx:#efecfb;--mt:#9d98bb;--ac:#9a85ff;--ln:#352f5e;--ok:#49c78f;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"SF Pro Text",system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0);z-index:5;background:var(--bg);padding:10px 14px 0;border-bottom:1px solid var(--ln)}
h1{font-size:20px;margin:0 0 8px;font-weight:700}
nav{display:flex;gap:4px}
nav button{flex:1;padding:10px 6px;border:0;background:none;color:var(--mt);font:inherit;font-weight:600;border-bottom:3px solid transparent}
nav button.on{color:var(--ac);border-color:var(--ac)}
main{padding:12px 14px 40px;max-width:1200px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
select,input{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:9px 11px;min-width:0}
input{flex:1;min-width:140px}
.seg{display:flex;border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--sf);color:var(--mt);padding:9px 12px;font:inherit}
.seg button.on{background:var(--ac);color:#fff}
.prog{color:var(--mt);margin:2px 0 12px;font-size:14px}
.meter{height:6px;border-radius:3px;background:var(--ln);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.card{position:relative;border:0;padding:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.card .im{display:block;aspect-ratio:367/512;border-radius:8px;background:var(--sf);border:1px solid var(--ln);overflow:hidden;position:relative}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .15s}
.card .fb{position:absolute;inset:0;padding:8px;font-size:13px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mt)}
.card:not(.on) img{filter:grayscale(1) opacity(.4)}
.card.on .im{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.card.on .im::after{content:"✓";position:absolute;right:5px;top:5px;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.card .nm{display:block;font-size:12px;margin-top:4px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .no{display:block;font-size:11px;color:var(--mt)}
.grp{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:12px}
.grp h3{margin:0;font-size:16px;display:flex;justify-content:space-between;gap:8px}
.grp h3 span{color:var(--mt);font-weight:500;font-size:14px}
.grp.done{border-color:var(--ok)}
.grp .grid{margin-top:10px;grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
.empty{color:var(--mt);padding:24px 8px;text-align:center}
.more{display:block;margin:6px auto;padding:10px 18px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--tx);font:inherit}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.pk{position:relative;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:10px 8px 8px;text-align:center;cursor:pointer;color:inherit;font:inherit}
.pk img{width:76px;height:76px;object-fit:contain;display:block;margin:0 auto 4px}
.pk.none img{filter:grayscale(1) opacity(.3)}
.pk .nm{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .no{display:block;font-size:12px;color:var(--mt)}
.pk .br{display:block;height:5px;border-radius:3px;background:var(--ln);margin:6px 4px 0;overflow:hidden}
.pk .br i{display:block;height:100%;background:var(--ac)}
.pk.full .br i{background:var(--ok)}
.pk .hr{position:absolute;left:7px;top:5px;font-size:13px;color:#ff3b5c}
.gh{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 8px;font-size:20px;font-weight:700}
.gh span{color:var(--mt);font-weight:500;font-size:16px}
.fav{border:1px solid var(--ln);background:var(--sf);color:var(--mt);border-radius:10px;padding:9px 12px;font:inherit}
.fav.on{color:#ff3b5c;border-color:#ff3b5c}
.dhead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.dhead img{width:92px;height:92px;object-fit:contain}
.heart{border:1px solid var(--ln);background:var(--sf);border-radius:50%;width:46px;height:46px;font-size:24px;color:var(--mt)}
.heart.on{color:#ff3b5c;border-color:#ff3b5c}
</style>
</head>
<body>
<header>
  <h1>Моя коллекция <small style="font-weight:400;color:var(--mt);font-size:12px">v6</small></h1>
  <nav id="nav">
    <button data-t="cards" class="on">Карточки</button>
    <button data-t="species">Покемоны</button>
    <button data-t="missions">Миссии</button>
  </nav>
</header>
<main id="main"><p class="empty">Загружаю карточки…</p></main>

<script src="missions.js"></script>
<script>
/* Данные и картинки берутся из репозитория flibustier/pokemon-tcg-pocket-database */
const PKG = "https://cdn.jsdelivr.net/npm/pokemon-tcg-pocket-database";
const RAW = "https://raw.githubusercontent.com/flibustier/pokemon-tcg-pocket-database/main";
const PIN = PKG + "@2.10.0"; /* запасная версия, если в свежей поменялись файлы */
const DATA_URLS = [PKG + "/dist/cards.extra.json", RAW + "/dist/cards.extra.json", PIN + "/dist/cards.extra.json"];
const SETS_URLS = [PKG + "/dist/sets.json", RAW + "/dist/sets.json", PIN + "/dist/sets.json"];
/* Картинки: приложение пробует адреса по очереди и запоминает рабочий */
const IMG_SRC = [
  (s, n, f) => RAW + "/cards-by-set/" + s + "/" + n + ".webp",
  (s, n, f) => PKG + "/cards-by-set/" + s + "/" + n + ".webp",
  (s, n, f) => "https://cdn.jsdelivr.net/gh/flibustier/pokemon-tcg-pocket-database@main/cards-by-set/" + s + "/" + n + ".webp",
  (s, n, f) => PIN + "/cards-by-set/" + s + "/" + n + ".webp",
  (s, n, f) => "https://raw.githubusercontent.com/flibustier/pokemon-tcg-exchange/main/public/images/cards/" + f
];
let pref = 0;
window.imgErr = el => { const t = (+el.dataset.t || 0) + 1; if (t >= IMG_SRC.length) { el.remove(); return; } el.dataset.t = t; const k = (pref + t) % IMG_SRC.length; el.dataset.k = k; el.src = IMG_SRC[k](el.dataset.s, el.dataset.n, el.dataset.f); };
window.imgOk = el => { pref = +(el.dataset.k || 0); };

/* Миссии лежат в файле missions.js (он должен быть рядом с index.html) */
const MISSIONS = window.MISSIONS || {};
const MIS = {};
Object.keys(MISSIONS).forEach(k => { MIS[k.toLowerCase()] = MISSIONS[k].map(m => ({ title: m.title, secret: m.secret, cards: m.cards.map(x => x.toLowerCase()) })); });

const KEY = "tcgp-owned-v1";
let owned = new Set();
try { owned = new Set(JSON.parse(localStorage.getItem(KEY) || "[]").map(x => String(x).toLowerCase())); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...owned])); } catch (e) {} };

let cards = [], sets = [], tab = "cards", dex = [], spMap = new Map(), keyMap = new Map();
const st = { set: "", q: "", show: "all", mset: "", secret: false, limit: 30, gen: "", favOnly: false, flt: "all", sort: "num", open: 0, scroll: 0 };
const cid = c => (c.set + "-" + c.number).toLowerCase();
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
const base = n => n.replace(/\s+ex$/i, "").trim();
const setName = s => (s.name && s.name.en) || s.code;

async function getJson(urls) {
  const errs = [];
  for (const u of urls) {
    try { const r = await fetch(u); if (r.ok) return await r.json(); errs.push(u.replace(/^https:\/\//, "").slice(0, 60) + " → " + r.status); }
    catch (e) { errs.push(u.replace(/^https:\/\//, "").slice(0, 60) + " → нет ответа"); }
  }
  throw new Error(errs.join("; "));
}

/* ===== Покемоны: список всех 1025 (PokeAPI), картинки, избранное ===== */
const SPR = [
  id => "https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/other/home/" + id + ".png",
  id => "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/" + id + ".png",
  id => "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/" + id + ".png"
];
window.sprErr = el => { const t = (+el.dataset.t || 0) + 1; if (t >= SPR.length) { el.style.visibility = "hidden"; return; } el.dataset.t = t; el.src = SPR[t](el.dataset.d); };
const GEN_END = [151, 251, 386, 493, 649, 721, 809, 905, 1025];
const genOf = id => GEN_END.findIndex(x => id <= x) + 1;
const SPECIAL = { "nidoran-f": "Nidoran ♀", "nidoran-m": "Nidoran ♂", "mr-mime": "Mr. Mime", "mime-jr": "Mime Jr.", "mr-rime": "Mr. Rime", "ho-oh": "Ho-Oh", "porygon-z": "Porygon-Z", "jangmo-o": "Jangmo-o", "hakamo-o": "Hakamo-o", "kommo-o": "Kommo-o", "type-null": "Type: Null", "farfetchd": "Farfetch’d", "sirfetchd": "Sirfetch’d", "flabebe": "Flabébé", "wo-chien": "Wo-Chien", "chien-pao": "Chien-Pao", "ting-lu": "Ting-Lu", "chi-yu": "Chi-Yu" };
const norm = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/♀/g, "f").replace(/♂/g, "m").toLowerCase().replace(/[^a-z0-9]/g, "");
const pretty = slug => SPECIAL[slug] || slug.split("-").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
const FKEY = "tcgp-fav-v1";
let fav = new Set();
try { fav = new Set((JSON.parse(localStorage.getItem(FKEY) || "[]")).map(Number)); } catch (e) {}
const saveFav = () => { try { localStorage.setItem(FKEY, JSON.stringify([...fav])); } catch (e) {} };

async function loadDex() {
  let slugs = null;
  try { slugs = JSON.parse(localStorage.getItem("tcgp-dex-v1") || "null"); } catch (e) {}
  if (!Array.isArray(slugs) || slugs.filter(Boolean).length < 1000) {
    try {
      const r = await getJson(["https://pokeapi.co/api/v2/pokemon-species?limit=2000"]);
      slugs = [];
      r.results.forEach(x => { const id = +String(x.url).replace(/\/$/, "").split("/").pop(); if (id >= 1 && id <= 1025) slugs[id - 1] = x.name; });
      try { localStorage.setItem("tcgp-dex-v1", JSON.stringify(slugs)); } catch (e) {}
    } catch (e) { slugs = null; }
  }
  return slugs;
}
function buildDex(slugs) {
  dex = [];
  (slugs || []).forEach((slug, i) => { if (slug && i < 1025) dex.push({ id: i + 1, slug, name: pretty(slug), gen: genOf(i + 1), key: norm(slug) }); });
}
function speciesOf(name) {
  const t = String(name).replace(/\s+ex$/i, "").split(/\s+/);
  for (let len = t.length; len >= 1; len--) for (let i = 0; i + len <= t.length; i++) { const k = norm(t.slice(i, i + len).join(" ")); if (keyMap.has(k)) return keyMap.get(k); }
  return 0;
}
function indexSpecies() {
  keyMap = new Map(dex.map(d => [d.key, d.id])); spMap = new Map();
  cards.forEach(c => { if (!c.poke) return; const id = speciesOf(c.name); if (id) { if (!spMap.has(id)) spMap.set(id, []); spMap.get(id).push(c); } });
}
const prog = d => { const l = spMap.get(d.id) || []; return { h: l.filter(c => owned.has(cid(c))).length, t: l.length }; };
function pkTile(d) {
  const p = prog(d);
  return '<button class="pk' + (p.t ? "" : " none") + (p.t && p.h === p.t ? " full" : "") + '" data-d="' + d.id + '">' + (fav.has(d.id) ? '<span class="hr">♥</span>' : "") +
    '<img loading="lazy" alt="" src="' + SPR[0](d.id) + '" data-d="' + d.id + '" data-t="0" onerror="sprErr(this)">' +
    '<span class="nm">' + esc(d.name) + '</span><span class="no">#' + d.id + '</span><span class="br"><i style="width:' + (p.t ? Math.round(p.h / p.t * 100) : 0) + '%"></i></span></button>';
}

function tile(c) {
  return '<button class="card' + (owned.has(cid(c)) ? " on" : "") + '" data-id="' + cid(c) + '">' +
    '<span class="im"><span class="fb">' + esc(c.name) + '</span><img loading="lazy" alt="" src="' + IMG_SRC[pref](c.set, c.number, c.image) + '" data-s="' + esc(c.set) + '" data-n="' + c.number + '" data-f="' + esc(c.image || "") + '" data-k="' + pref + '" onerror="imgErr(this)" onload="imgOk(this)"></span>' +
    '<span class="nm">' + esc(c.name) + '</span><span class="no">' + c.set + " · " + c.number + " · " + c.rarity + "</span></button>";
}
function setSelect(id, val, withAll) {
  return '<select id="' + id + '">' + (withAll ? '<option value="">Все сеты</option>' : "") +
    sets.map(s => '<option value="' + s.code + '"' + (s.code === val ? " selected" : "") + ">" + esc(setName(s)) + " (" + s.code + ")</option>").join("") + "</select>";
}
function meter(a, b) { return '<div class="meter"><i style="width:' + (b ? Math.round(a / b * 100) : 0) + '%"></i></div>'; }

function build() {
  const m = $("#main");
  if (tab === "cards") {
    m.innerHTML = '<div class="bar">' + setSelect("fset", st.set, true) +
      '<input id="fq" type="search" placeholder="Поиск по имени" value="' + esc(st.q) + '">' +
      '<div class="seg" id="fshow">' + [["all", "Все"], ["have", "Есть"], ["miss", "Нет"]].map(x => '<button data-v="' + x[0] + '"' + (st.show === x[0] ? ' class="on"' : "") + ">" + x[1] + "</button>").join("") + "</div></div>" +
      '<div class="prog" id="prog"></div><div class="grid" id="body"></div>';
    $("#fset").onchange = e => { st.set = e.target.value; draw(); };
    $("#fq").oninput = e => { st.q = e.target.value; draw(); };
    $("#fshow").onclick = e => { const v = e.target.dataset.v; if (v) { st.show = v; build(); } };
  } else if (tab === "species") {
    if (st.open) {
      const d = dex.find(x => x.id === st.open) || { id: st.open, name: "#" + st.open };
      const f = fav.has(d.id);
      m.innerHTML = '<button class="more" id="back" style="margin:0 0 10px">← Назад</button>' +
        '<div class="dhead"><img src="' + SPR[0](d.id) + '" data-d="' + d.id + '" data-t="0" onerror="sprErr(this)" alt="">' +
        '<div style="flex:1"><div style="font-size:22px;font-weight:700">' + esc(d.name) + ' <span class="prog">#' + d.id + '</span></div><div class="prog" id="dprog"></div></div>' +
        '<button class="heart' + (f ? " on" : "") + '" id="hrt">' + (f ? "♥" : "♡") + '</button></div><div class="grid" id="body"></div>';
    } else if (!dex.length) {
      m.innerHTML = '<p class="empty">Не удалось загрузить список покемонов. Нужен интернет при первом запуске, обнови страницу.</p>';
    } else {
      const opt = (arr, cur) => arr.map(x => '<option value="' + x[0] + '"' + (String(cur) === String(x[0]) ? " selected" : "") + ">" + x[1] + "</option>").join("");
      m.innerHTML = '<div class="bar"><input id="fq" type="search" placeholder="Поиск по имени или номеру" value="' + esc(st.q) + '"></div>' +
        '<div class="bar"><select id="fgen">' + opt([["", "Все поколения"]].concat([1, 2, 3, 4, 5, 6, 7, 8, 9].map(g => [g, "Поколение " + g])), st.gen) + "</select>" +
        '<button class="fav' + (st.favOnly ? " on" : "") + '" id="ffav">♥ Избранные</button>' +
        '<select id="fflt">' + opt([["all", "Все"], ["have", "Есть карты"], ["none", "Нет карт"], ["full", "Собрано"], ["tcg", "Есть в TCG Pocket"]], st.flt) + "</select>" +
        '<select id="fsort">' + opt([["num", "По номеру"], ["name", "По имени"], ["prog", "По прогрессу"]], st.sort) + '</select></div><div id="body"></div>';
      $("#fq").oninput = e => { st.q = e.target.value; draw(); };
      $("#fgen").onchange = e => { st.gen = e.target.value; draw(); };
      $("#fflt").onchange = e => { st.flt = e.target.value; draw(); };
      $("#fsort").onchange = e => { st.sort = e.target.value; draw(); };
      $("#ffav").onclick = e => { st.favOnly = !st.favOnly; e.currentTarget.classList.toggle("on", st.favOnly); draw(); };
    }
  } else {
    if (!st.mset && sets.length) st.mset = (sets.find(x => MIS[x.code.toLowerCase()]) || sets[0]).code;
    m.innerHTML = '<div class="bar">' + setSelect("fset", st.mset, false) +
      '<div class="seg" id="fsec"><button data-v="0"' + (!st.secret ? ' class="on"' : '') + '>Обычные</button><button data-v="1"' + (st.secret ? ' class="on"' : '') + '>Секретные</button></div></div><div id="body"></div>';
    $("#fset").onchange = e => { st.mset = e.target.value; draw(); };
    $("#fsec").onclick = e => { const v = e.target.dataset.v; if (v) { st.secret = v === "1"; build(); } };
  }
  draw();
}

function draw() {
  const body = $("#body"), q = st.q.trim().toLowerCase();
  if (tab === "cards") {
    let list = cards.filter(c => (!st.set || c.set === st.set) && (!q || c.name.toLowerCase().includes(q)));
    const have = list.filter(c => owned.has(cid(c))).length;
    $("#prog").innerHTML = "Собрано " + have + " из " + list.length + meter(have, list.length);
    if (st.show === "have") list = list.filter(c => owned.has(cid(c)));
    if (st.show === "miss") list = list.filter(c => !owned.has(cid(c)));
    body.innerHTML = list.length ? list.map(tile).join("") : '<p class="empty">Ничего не найдено</p>';
    body.className = "grid";
  } else if (tab === "species") {
    if (st.open) {
      const l = spMap.get(st.open) || [], h = l.filter(c => owned.has(cid(c))).length;
      $("#dprog").innerHTML = l.length ? "Собрано " + h + " из " + l.length + meter(h, l.length) : "Для этого покемона нет карточек в TCG Pocket";
      body.innerHTML = l.map(tile).join("");
    } else if (dex.length) {
      const list = dex.filter(d => {
        if (st.gen && d.gen !== +st.gen) return false;
        if (st.favOnly && !fav.has(d.id)) return false;
        if (q && !d.name.toLowerCase().includes(q) && String(d.id) !== q) return false;
        if (st.flt === "all") return true;
        const p = prog(d);
        return (st.flt === "have" && p.h > 0) || (st.flt === "none" && p.h === 0) || (st.flt === "full" && p.t > 0 && p.h === p.t) || (st.flt === "tcg" && p.t > 0);
      });
      if (st.sort === "name") list.sort((a, b) => a.name.localeCompare(b.name));
      if (st.sort === "prog") { const r = d => { const p = prog(d); return p.t ? p.h / p.t : -1; }; list.sort((a, b) => r(b) - r(a) || a.id - b.id); }
      if (!list.length) { body.innerHTML = '<p class="empty">Ничего не найдено</p>'; return; }
      if (st.sort === "num" && !st.gen) {
        let out = "";
        for (let g = 1; g <= 9; g++) { const gl = list.filter(d => d.gen === g); if (gl.length) out += '<div class="gh">Поколение ' + g + "<span>" + gl.length + '</span></div><div class="dgrid">' + gl.map(pkTile).join("") + "</div>"; }
        body.innerHTML = out;
      } else body.innerHTML = '<div class="dgrid">' + list.map(pkTile).join("") + "</div>";
    }
  } else {
    const all = (MIS[(st.mset || "").toLowerCase()] || []), list = all.filter(x => !!x.secret === st.secret);
    body.innerHTML = (list.length ? '<p class="prog">В игре некоторые миссии засчитывают любую версию карты, поэтому сверяйся с самой миссией.</p>' : '') + (list.length ? list.map(x => {
      const h = x.cards.filter(i => owned.has(i)).length, byId = new Map(cards.map(c => [cid(c), c]));
      return '<section class="grp' + (h === x.cards.length ? " done" : "") + '"><h3>' + esc(x.title) + "<span>" + h + " / " + x.cards.length + "</span></h3>" +
        '<div class="grid">' + x.cards.map(i => byId.get(i)).filter(Boolean).map(tile).join("") + "</div></section>";
    }).join("") : '<p class="empty">Для этого сета пока нет ' + (st.secret ? "секретных" : "обычных") + " миссий. Они хранятся в файле missions.js.</p>");
  }
}

document.addEventListener("click", e => {
  const pk = e.target.closest(".pk");
  if (pk) { st.scroll = window.scrollY || 0; st.open = +pk.dataset.d; build(); window.scrollTo(0, 0); return; }
  if (e.target.closest("#back")) { st.open = 0; build(); window.scrollTo(0, st.scroll || 0); return; }
  if (e.target.closest("#hrt")) { fav.has(st.open) ? fav.delete(st.open) : fav.add(st.open); saveFav(); build(); return; }
  const b = e.target.closest(".card"); if (!b) return;
  const i = b.dataset.id;
  owned.has(i) ? owned.delete(i) : owned.add(i);
  save();
  if (tab === "cards" && st.show === "all") {
    document.querySelectorAll('[data-id="' + i + '"]').forEach(x => x.classList.toggle("on", owned.has(i)));
    const l = cards.filter(c => (!st.set || c.set === st.set) && (!st.q.trim() || c.name.toLowerCase().includes(st.q.trim().toLowerCase())));
    const h = l.filter(c => owned.has(cid(c))).length;
    $("#prog").innerHTML = "Собрано " + h + " из " + l.length + meter(h, l.length);
  } else draw();
});
$("#nav").onclick = e => {
  const t = e.target.dataset.t; if (!t) return;
  tab = t; st.limit = 30;
  document.querySelectorAll("#nav button").forEach(x => x.classList.toggle("on", x.dataset.t === t));
  build();
};

(async () => {
  const msg = t => { $("#main").innerHTML = '<p class="empty">' + t + "</p>"; };
  window.addEventListener("error", e => { if (!cards.length) msg("Ошибка в приложении: " + esc(e.message)); });
  try {
    const [c0, s, slugs] = await Promise.all([getJson(DATA_URLS), getJson(SETS_URLS).catch(() => ({})), loadDex()]);
    const c = Array.isArray(c0) ? c0 : (c0 && (c0.cards || Object.values(c0).find(Array.isArray))) || [];
    cards = c.map(x => Object.assign({}, x, { poke: x.type === "pokemon" }));
    sets = Object.values(s || {}).flat().sort((a, b) => (b.releaseDate || "").localeCompare(a.releaseDate || ""));
    const known = new Set(sets.map(x => x.code));
    [...new Set(cards.map(x => x.set))].filter(x => !known.has(x)).forEach(code => sets.push({ code, name: { en: code } }));
    if (!cards.length) throw new Error("список карточек пуст");
    buildDex(slugs); indexSpecies();
    build();
  } catch (e) {
    msg("Не удалось загрузить данные.<br><small>" + esc(e.message || e) + "</small><br>Проверь интернет и обнови страницу.");
  }
})();
</script>
</body>
</html>
