<style>

.pk img{width:76px;height:76px;object-fit:contain;display:block;margin:0 auto 4px}
.pk.none img{filter:grayscale(1) opacity(.3)}
.pk .nm{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .no{display:block;font-size:12px;color:var(--mt)}

.gh{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 8px;font-size:20px;font-weight:700}

.dhead{display:flex;align-items:center;gap:14px;margin-bottom:14px}

.heart.on{color:#ff3b5c;border-color:#ff3b5c}
.mctl{display:flex;align-items:center;gap:14px}.mctl button{width:44px;height:44px;border-radius:50%;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font-size:22px}.mctl b{font-size:18px;min-width:70px;text-align:center}
.og{grid-column:1/-1;border:1px dashed var(--ln);border-radius:12px;padding:8px}.ol{font-size:12px;color:var(--mt);margin-bottom:6px}
.mv{border:1px solid var(--ln);background:none;color:var(--mt);border-radius:10px;padding:4px 12px;font:inherit;font-size:18px;line-height:1.2}.mh{cursor:pointer;align-items:center;gap:8px}.mh .mt{flex:1;color:var(--tx);font-weight:700;font-size:16px}.mh .chev{color:var(--mt);width:14px;font-size:14px}
.tb{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,100px));z-index:4;background:var(--bg);margin:0 -14px;padding:8px 14px 2px}
.tb .bar{margin-bottom:6px}
.card .ck{position:absolute;right:3px;bottom:3px;width:30px;height:30px;padding:0;border:0;background:none;color:transparent;font-size:18px;line-height:1;text-shadow:0 0 3px rgba(0,0,0,.55)}
.card .ck::before{content:"";position:absolute;inset:-8px}
.card.on .ck{color:rgba(255,255,255,.6)}
#cv,#pv{position:fixed;inset:0;background:var(--bg);overflow:auto;box-sizing:border-box;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 30px}
#cv{z-index:50}#pv{z-index:40}
#cv[hidden],#pv[hidden]{display:none}
.cvw{display:flex;gap:16px;flex-wrap:wrap;max-width:1000px;margin:0 auto;align-items:flex-start}
.cvl{flex:1 1 300px;max-width:420px}.cvr{flex:2 1 320px}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
.cvimg{width:100%;display:block;border-radius:12px;aspect-ratio:367/512;object-fit:cover}
.cvt{font-size:20px;font-weight:700;margin-top:10px}
.panel.sm{display:inline-block;padding:8px 14px;min-width:190px}.crow{display:flex;align-items:center;gap:10px;font-size:15px}.crow input{width:18px;height:18px;flex:none;padding:0}
.irow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}.irow:last-child{border-bottom:0}.irow span{color:var(--mt)}.irow b{text-align:right;font-weight:600}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.hc{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px}.hc small{color:var(--mt);font-size:13px}.hc .big{font-size:36px;font-weight:800;line-height:1.1;margin:2px 0}.hc .sub{color:var(--mt);font-size:13px}
.acc{background:var(--sf);border:1px solid var(--ln);border-radius:16px;margin-bottom:10px;overflow:hidden}
.acc summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}.acc summary::-webkit-details-marker{display:none}
.ai{width:40px;height:40px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.at{flex:1;min-width:0}.at b{display:block;font-size:16px}.at small{color:var(--mt)}
.chv{color:var(--mt);font-size:24px;transition:transform .15s}.acc[open] .chv{transform:rotate(90deg)}
.accb{padding:0 14px 8px;border-top:1px solid var(--ln)}
.qb{position:absolute;left:5px;bottom:4px;font-size:13px;font-weight:700;color:#fff;text-shadow:0 0 3px #000;opacity:.85}
.stp{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px}.stp b{min-width:20px;text-align:center}
.stp button,.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--ln);background:var(--bg);color:var(--tx);padding:0;font-size:16px;line-height:1}
.qty{display:flex;align-items:center;gap:8px;margin-left:12px}.qty b{min-width:22px;text-align:center}
.gs{display:inline-block;width:1em;height:1em;vertical-align:-0.14em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pk .nm{line-height:1.5}
.fav.st.on{color:#e8a900;border-color:#e8a900}
.panel.sm.ctl{display:inline-flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 14px;max-width:100%}
.rb{width:40px;height:40px;border-radius:50%;border:1px solid var(--ln);background:var(--bg);color:var(--mt);font-size:20px;line-height:1;padding:0}
.rb.on{color:#fff;background:var(--ok);border-color:var(--ok)}.rb.heart.on{background:none;color:#ff3b5c;border-color:#ff3b5c}.rb.star.on{background:none;color:#e8a900;border-color:#e8a900}
.ctl .qty{margin:0;padding:0 14px;border-left:1px solid var(--ln);border-right:1px solid var(--ln)}
.gt{margin-top:8px;font-weight:700}.ind{padding-left:12px;border-left:2px solid var(--ln);margin-left:2px}.bk{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}.bk .more{margin:0}
@media(max-width:480px){.rb{width:36px;height:36px;font-size:18px}.ctl .qty{padding:0 8px}.panel.sm.ctl{gap:8px 10px}}
.note{background:var(--sf);border:1px solid #e8a900;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.src{max-width:1200px;margin:0 auto;padding:6px 14px 28px;font-size:12px;color:var(--mt);text-align:center}.src a{color:inherit}
.card .stg{position:absolute;right:6px;bottom:9px;font-size:20px;line-height:1;color:#e8a900;pointer-events:none}
@media(min-width:700px){#pv .grid{grid-template-columns:repeat(5,1fr)}}
.tb .prog{margin:2px 0 8px}
#pv{padding-top:0;touch-action:pan-y}
.pvh{position:sticky;top:0;z-index:3;background:var(--bg);margin:0 -14px 10px;padding:0 14px 8px}
.pvb{padding:calc(env(safe-area-inset-top,0px) + 10px) 0 8px;border-bottom:1px solid var(--ln);margin-bottom:10px}.pvb .more{margin:0}.pvh .dhead{margin:0}
.ssort{margin:10px 0 2px}.ssort button{flex:1;font-size:13px;padding:8px 6px}
.srow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px;margin-bottom:10px;color:inherit;font:inherit;cursor:pointer}
.slogo{flex:none;width:112px;height:56px;display:flex;align-items:center;justify-content:center}.slogo img{max-width:100%;max-height:100%;object-fit:contain}
.slogo .lgt{display:none;font-size:13px;text-align:center;line-height:1.2}.slogo.nologo .lgt{display:block}.slogo.sm{width:72px;height:36px}
.sbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.stt{font-size:17px;font-weight:600}
.srow .meter{display:block;height:6px;border-radius:3px;background:var(--ln);overflow:hidden;margin:0}.srow .meter i{display:block;height:100%;background:var(--ac)}
.sft{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.cd{font-size:12px;border:1px solid var(--mt);border-radius:5px;padding:1px 6px;color:var(--mt);font-weight:600}
.scnt{margin-left:auto;color:var(--mt);font-size:14px;white-space:nowrap}.rch{display:flex;gap:6px;flex-wrap:wrap}
.rc{font-style:normal;font-size:12px;background:var(--bg);border:1px solid var(--ln);border-radius:999px;padding:2px 8px;color:var(--mt)}
.rc.d{color:#8fb3d9}.rc.s{color:#e8a900}.rc.c{color:#d9a200}.rc.h{color:#b57bff}
.prow{margin-left:14px;width:calc(100% - 14px)}.sgh{display:flex;align-items:center;gap:10px;margin:16px 2px 8px;flex-wrap:wrap}.sgh b{font-size:18px}
/* ===== Pack: бустер ProDex и физическая коллекция ===== */
.pxwrap{max-width:620px;margin:0 auto}
.pxstage{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0 16px}
.pxpack{--w:210px;position:relative;width:var(--w);aspect-ratio:7/11;border:0;padding:0;cursor:pointer;border-radius:10px 10px 12px 12px;color:#fff;font:inherit;
 background:linear-gradient(162deg,#2fd0ff 0%,#4f8bff 22%,#8b4dff 48%,#d23bff 70%,#ff4fa8 100%);box-shadow:0 14px 40px rgba(140,60,255,.45),inset 0 0 0 1px rgba(255,255,255,.25);overflow:hidden;animation:pxfloat 3.2s ease-in-out infinite}
.pxpack::before,.pxpack::after{content:"";position:absolute;left:0;right:0;height:5%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 3px,rgba(0,0,0,.12) 3px 6px);z-index:2}
.pxpack::before{top:0}.pxpack::after{bottom:0}
.pxshine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.38) 45%,transparent 60%);background-size:250% 100%;animation:pxshine 3.6s linear infinite;pointer-events:none;z-index:1}
.pxlogo{position:absolute;left:0;right:0;top:15%;text-align:center;font-weight:800;font-size:calc(var(--w)*.15);letter-spacing:.5px;text-shadow:0 2px 8px rgba(40,0,90,.45);z-index:2}
.pxball{position:absolute;left:50%;top:50%;width:calc(var(--w)*.34);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;z-index:2;
 background:linear-gradient(#fff 0 0) center/100% 9% no-repeat,radial-gradient(circle,#fff 0 17%,rgba(60,20,120,.9) 17% 25%,transparent 25%),linear-gradient(rgba(255,255,255,.95) 0 45%,transparent 45% 55%,rgba(255,255,255,.55) 55%);
 -webkit-mask:radial-gradient(circle,#000 69%,transparent 70%);mask:radial-gradient(circle,#000 69%,transparent 70%);opacity:.9}
.pxtag{position:absolute;left:0;right:0;bottom:12%;text-align:center;font-size:calc(var(--w)*.052);font-weight:700;letter-spacing:1px;opacity:.92;z-index:2}
.pxtag b{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:6px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.5);font-size:calc(var(--w)*.075);letter-spacing:1.5px}
@keyframes pxfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pxshine{0%{background-position:150% 0}100%{background-position:-100% 0}}
.pxbtn{border:0;border-radius:999px;padding:13px 28px;font:inherit;font-weight:700;font-size:17px;color:#fff;cursor:pointer;background:linear-gradient(90deg,#8b4dff,#d23bff);box-shadow:0 6px 18px rgba(160,60,255,.4)}
.pxbtn:active{transform:scale(.97)}
.pxbtn.sec{background:var(--sf);color:var(--tx);border:1px solid var(--ln);box-shadow:none}
.hc .big span{font-size:18px;color:var(--mt);font-weight:600}
.pxfive{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(max-width:480px){.pxfive{grid-template-columns:repeat(3,1fr)}}
.pxmini{position:relative;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:8px 4px 6px;text-align:center;min-width:0}
.pxmini img,.pxmini .pxph{width:100%;max-width:84px;aspect-ratio:1;object-fit:contain;display:block;margin:0 auto 2px}
.pxmini .nm{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pxmini .no{display:block;font-size:11px;color:var(--mt)}
.pxmini.L{border-color:#e8a900;box-shadow:0 0 0 1px #e8a900 inset}.pxmini.M{border-color:#ff4fa8;box-shadow:0 0 0 1px #ff4fa8 inset}
.pxnew{position:absolute;right:4px;top:4px;font-size:10px;font-weight:800;color:#fff;background:var(--ok);border-radius:6px;padding:1px 5px}
.pxcat{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.4px;border-radius:6px;padding:1px 6px;color:#fff}
.pxcat.L{background:#d79c00}.pxcat.M{background:#e0378f}
.pxph{display:flex!important;align-items:center;justify-content:center;font-weight:800;color:var(--mt);background:var(--bg);border-radius:10px;font-size:15px}
.pxodds{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0}.pxodds td,.pxodds th{padding:7px 4px;border-bottom:1px solid var(--ln);text-align:right}.pxodds td:first-child,.pxodds th:first-child{text-align:left}.pxodds th{color:var(--mt);font-weight:500;font-size:12px}
/* оверлей открытия */
#pxov{position:fixed;inset:0;z-index:70;background:radial-gradient(circle at 50% 40%,rgba(90,40,170,.96),rgba(12,8,30,.98));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 54px) 16px calc(env(safe-area-inset-bottom,0px) + 20px);overflow:auto;user-select:none;-webkit-user-select:none}
#pxov[hidden]{display:none}
.pxx{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;display:flex;gap:8px}
.pxx button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.pxcnt{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:16px;font-weight:700;opacity:.85}
.pxhint{margin-top:16px;opacity:.75;font-size:14px;text-align:center}
.pxtear{position:relative;--w:min(62vw,250px);width:var(--w);aspect-ratio:7/11;cursor:pointer}
.pxtear .pxpack{--w:min(62vw,250px);position:absolute;inset:0;width:100%;animation:pxwig 1.6s ease-in-out infinite}
.pxtear .pxpack.top{clip-path:inset(0 0 82% 0)}.pxtear .pxpack.bot{clip-path:inset(18% 0 0 0)}
.pxtear.go .pxpack.top{transition:transform .55s cubic-bezier(.3,.6,.4,1),opacity .55s;transform:translate(40%,-60%) rotate(18deg);opacity:0;animation:none}
.pxtear.go .pxpack.bot{transition:transform .6s .25s ease-in,opacity .6s .25s;transform:translateY(40%);opacity:0;animation:none}
@keyframes pxwig{0%,100%{transform:rotate(0)}20%{transform:rotate(-2deg)}40%{transform:rotate(2deg)}60%{transform:rotate(-1deg)}}
.pxbig{position:relative;width:min(74vw,300px);aspect-ratio:5/7;border-radius:18px;background:linear-gradient(160deg,#fff,#efeaff);color:#1f1b33;box-shadow:0 16px 50px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;cursor:pointer;animation:pxin .45s cubic-bezier(.2,.8,.3,1.2)}
.pxbig img,.pxbig .pxph{width:82%;aspect-ratio:1;object-fit:contain}
.pxbig .nm{font-size:22px;font-weight:800;margin-top:6px;text-align:center}.pxbig .no{color:#6f6a85;font-size:14px}
.pxbig .pxcat{position:absolute;left:12px;top:12px;font-size:12px;padding:3px 9px}
.pxbig .pxnew{right:12px;top:12px;font-size:12px;padding:3px 8px}
.pxbig.L{background:linear-gradient(160deg,#fff8dc,#ffe08a);box-shadow:0 0 0 3px #e8a900,0 0 60px rgba(255,200,40,.75)}
.pxbig.M{background:linear-gradient(160deg,#ffe6f4,#e3c9ff);box-shadow:0 0 0 3px #ff4fa8,0 0 60px rgba(255,80,190,.75)}
@keyframes pxin{0%{transform:perspective(700px) rotateY(90deg) scale(.8);opacity:0}100%{transform:none;opacity:1}}
.pxsum{width:min(100%,640px)}.pxsum h2{text-align:center;margin:0 0 4px}.pxsum .pxhint{margin:0 0 14px}
.pxsum .pxmini{background:rgba(255,255,255,.95);color:#1f1b33;border-color:transparent;animation:pxin .4s both}

<script>
/* Данные и картинки берутся из репозитория flibustier/pokemon-tcg-pocket-database */
const PKG = "https://cdn.jsdelivr.net/npm/pokemon-tcg-pocket-database";
const RAW = "https://raw.githubusercontent.com/flibustier/pokemon-tcg-pocket-database/main";
const PIN = PKG + "@2.10.0"; /* запасная версия, если в свежей поменялись файлы */
/* Если файл открыт прямо с диска (file://): файлы dist/ и картинки берём из репозитория на GitHub,
   а если их там нет — из данных, встроенных в этот же файл (window.EMB, есть только в однофайловой сборке) */
const ASSET = location.protocol === "file:" ? "https://raw.githubusercontent.com/BunnyLyra/ProDex/main/" : "";
const EMB = window.EMB || {};
/* Основа: твой dist/cards.json (все сеты, типы, паки). Если его рядом нет, берём копии из интернета по очереди, а не все сразу. */
const BASE_URLS = ["dist/cards.json", PKG + "/dist/cards.json", RAW + "/dist/cards.json", PIN + "/dist/cards.json"];
const SETS_URLS = ["dist/sets.json", PKG + "/dist/sets.json", RAW + "/dist/sets.json", PIN + "/dist/sets.json"];
/* Картинки: приложение пробует адреса по очереди и запоминает рабочий */
const IMG_SRC = [
  (s, n, f) => ASSET + "dist/images/cards-by-set/" + s + "/" + n + ".webp",
  (s, n, f) => "dist/images/cards/" + f,
  (s, n, f) => "cards-by-set/" + s + "/" + n + ".webp",
  (s, n, f) => "dist/cards-by-set/" + s + "/" + n + ".webp",
  (s, n, f) => "images/" + s + "/" + n + ".webp",
  (s, n, f) => "dist/images/" + s + "/" + n + ".webp",
  (s, n, f) => "images/" + f,
  (s, n, f) => RAW + "/cards-by-set/" + s + "/" + n + ".webp",
  (s, n, f) => PKG + "/cards-by-set/" + s + "/" + n + ".webp",
  (s, n, f) => "https://cdn.jsdelivr.net/gh/flibustier/pokemon-tcg-pocket-database@main/cards-by-set/" + s + "/" + n + ".webp",
  (s, n, f) => PIN + "/cards-by-set/" + s + "/" + n + ".webp",
  (s, n, f) => "https://raw.githubusercontent.com/flibustier/pokemon-tcg-exchange/main/public/images/cards/" + f,
  (s, n, f) => "https://raw.githubusercontent.com/BunnyLyra/ProDex/main/dist/images/cards-by-set/" + s + "/" + n + ".webp"   /* копия картинок в самом репозитории ProDex */
];
let pref = 0;
window.imgFail = 0;
window.imgErr = el => {
  const t = (+el.dataset.t || 0) + 1;
  if (t >= IMG_SRC.length) {
    el.remove();
    if (++window.imgFail === 6 && !document.getElementById("imgwarn")) {
      const w = document.createElement("div"); w.id = "imgwarn"; w.className = "prog"; w.style.padding = "6px 14px";
      w.textContent = "Картинки не найдены. Пример проверенного адреса: " + IMG_SRC[0](el.dataset.s, el.dataset.n, el.dataset.f) + " (и ещё " + (IMG_SRC.length - 1) + " вариантов)";
      document.body.insertBefore(w, document.querySelector("main"));
    }
    return;
  }
  el.dataset.t = t; const k = (pref + t) % IMG_SRC.length; el.dataset.k = k; el.src = IMG_SRC[k](el.dataset.s, el.dataset.n, el.dataset.f);
};
window.imgOk = el => { pref = +(el.dataset.k || 0); };

/* Миссии лежат в файле missions.js (он должен быть рядом с index.html) */
const MISSIONS = window.MISSIONS || {};
let MIS = {};
const VER = new Set();
const CODE_LIST = [["Genetic Apex", "A1"], ["Mythical Island", "A1a"], ["Space-Time Smackdown", "A2"], ["Triumphant Light", "A2a"], ["Shining Revelry", "A2b"], ["Celestial Guardians", "A3"], ["Extradimensional Crisis", "A3a"], ["Eevee Grove", "A3b"], ["Wisdom of Sea and Sky", "A4"], ["Secluded Springs", "A4a"], ["Deluxe Pack: ex", "A4b"], ["Mega Rising", "B1"], ["Crimson Blaze", "B1a"], ["Fantastical Parade", "B2"], ["Paldean Wonders", "B2a"], ["Mega Shine", "B2b"], ["Pulsing Aura", "B3"], ["Paradox Drive", "B3a"], ["Everyday Wonders", "B3b"], ["Ruler of the Skies", "B4"], ["Team Rocket's Ambition", "B4a"], ["Deluxe Pack: Mega", "B4b"], ["Dual Fusion", "C1"]];
function buildMIS() {
  MIS = {}; VER.clear();
  const CODE_BY_NAME = {}; CODE_LIST.forEach(x => { CODE_BY_NAME[norm(x[0])] = x[1]; });
  const byName = new Map(sets.map(x => [norm(setName(x)), x.code]));
  Object.keys(MISSIONS).forEach(key => {
    const want = CODE_BY_NAME[norm(key)];
    const code = byName.get(norm(key)) || (sets.find(x => x.code === want) || {}).code;
    if (!code) return;
    const lc = code.toLowerCase();
    if ((window.VERIFIED || []).includes(key)) VER.add(lc);
    MIS[lc] = MISSIONS[key].map(m => {
      const x = Object.assign({}, m);
      if (m.groups) { const cv = e => typeof e === "number" ? lc + "-" + e : String(e).toLowerCase(); x.groups = m.groups.map(g => Array.isArray(g) ? g.map(cv) : Object.assign({}, g, { p: g.p ? g.p.map(cv) : undefined, sl: g.sl ? g.sl.map(sl => sl.map(cv)) : undefined, f: g.f ? Object.assign({ set: code }, g.f) : undefined, set: g.dx ? lc : undefined })); }
      if (m.inset) x.filter = Object.assign({}, m.filter || {}, { set: code });
      return x;
    });
  });
}

const KEY = "tcgp-owned-v1";
let owned = new Set();
try { owned = new Set(JSON.parse(localStorage.getItem(KEY) || "[]").map(x => String(x).toLowerCase())); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...owned])); } catch (e) {} };

let cards = [], sets = [], tab = "cards", dex = [], spMap = new Map(), keyMap = new Map();
const st = { set: "", q: "", show: "all", mset: "", secret: false, limit: 30, grid: false, cv: "sets", sq: "", sscroll: 0, cl: 240, cardOpen: "", wish: false, alt: false, pack: "", gen: "", favOnly: false, flt: "all", sort: "num", open: 0, scroll: 0, pv: "box", pq: "", pf: "all", pg: "", pc: "", dq: "", dc: "" };
const UIKEY = "tcgp-ui-v1", UI_FIELDS = ["grid", "cv", "sq", "set", "pack", "q", "show", "wish", "alt", "gen", "favOnly", "flt", "sort", "mset", "secret", "pv", "pf", "pg", "pc", "dc"];
try { const u = JSON.parse(localStorage.getItem(UIKEY) || "null"); if (u) { UI_FIELDS.forEach(k => { if (u[k] !== undefined) st[k] = u[k]; }); if (["cards", "species", "missions", "stats", "pack"].includes(u.tab)) tab = u.tab; } } catch (e) {}
function saveUI() { try { const o = { tab }; UI_FIELDS.forEach(k => { o[k] = st[k]; }); localStorage.setItem(UIKEY, JSON.stringify(o)); } catch (e) {} }
const cid = c => (c.set + "-" + c.number).toLowerCase();
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
const base = n => n.replace(/\s+ex$/i, "").trim();
const setName = s => (s.name && s.name.en) || s.code;

const asArr = d => Array.isArray(d) ? d : (d && typeof d === "object" ? (Array.isArray(d.cards) ? d.cards : (Object.values(d).find(Array.isArray) || [])) : []);
async function getJson(urls) {
  const errs = [];
  for (const u0 of urls) {
    const u = ASSET && /^dist\//.test(u0) ? ASSET + u0 : u0;
    try { const r = await fetch(u); if (r.ok) return await r.json(); errs.push(u.replace(/^https:\/\//, "").slice(0, 60) + " → " + r.status); }
    catch (e) { errs.push(u.replace(/^https:\/\//, "").slice(0, 60) + " → нет ответа"); }
    if (EMB[u0]) return EMB[u0];   /* встроенная копия этого файла */
  }
  throw new Error(errs.join("; "));
}

/* ===== Покемоны: список всех 1025 (PokeAPI), картинки, избранное ===== */
const SPR = [
  id => "https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/other/home/" + id + ".png",
  id => "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/" + id + ".png",
  id => "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/" + id + ".png"
];
window.sprErr = el => { const t = (+el.dataset.t || 0) + 1; if (t >= SPR.length) { el.style.visibility = "hidden"; return; } el.dataset.t = t; el.src = SPR[t](el.dataset.d); };
const GEN_END = [151, 251, 386, 493, 649, 721, 809, 905, 1025];
const genOf = id => GEN_END.findIndex(x => id <= x) + 1;
const SPECIAL = { "nidoran-f": "Nidoran ♀", "nidoran-m": "Nidoran ♂", "mr-mime": "Mr. Mime", "mime-jr": "Mime Jr.", "mr-rime": "Mr. Rime", "ho-oh": "Ho-Oh", "porygon-z": "Porygon-Z", "jangmo-o": "Jangmo-o", "hakamo-o": "Hakamo-o", "kommo-o": "Kommo-o", "type-null": "Type: Null", "farfetchd": "Farfetch’d", "sirfetchd": "Sirfetch’d", "flabebe": "Flabébé", "wo-chien": "Wo-Chien", "chien-pao": "Chien-Pao", "ting-lu": "Ting-Lu", "chi-yu": "Chi-Yu" };
const norm = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/♀/g, "f").replace(/♂/g, "m").toLowerCase().replace(/[^a-z0-9]/g, "");
const pretty = slug => SPECIAL[slug] || slug.split("-").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
const FKEY = "tcgp-fav-v1";
let fav = new Set();
try { fav = new Set((JSON.parse(localStorage.getItem(FKEY) || "[]")).map(Number)); } catch (e) {}
const saveFav = () => { try { localStorage.setItem(FKEY, JSON.stringify([...fav])); } catch (e) {} };

async function loadDex() {
  let slugs = null;
  try { slugs = JSON.parse(localStorage.getItem("tcgp-dex-v1") || "null"); } catch (e) {}
  if (!Array.isArray(slugs) || slugs.filter(Boolean).length < 1000) {
    try {
      const r = await getJson(["https://pokeapi.co/api/v2/pokemon-species?limit=2000"]);
      slugs = [];
      r.results.forEach(x => { const id = +String(x.url).replace(/\/$/, "").split("/").pop(); if (id >= 1 && id <= 1025) slugs[id - 1] = x.name; });
      try { localStorage.setItem("tcgp-dex-v1", JSON.stringify(slugs)); } catch (e) {}
    } catch (e) { slugs = null; }
  }
  return slugs;
}
function buildDex(slugs) {
  dex = [];
  (slugs || []).forEach((slug, i) => { if (slug && i < 1025) dex.push({ id: i + 1, slug, name: pretty(slug), gen: genOf(i + 1), key: norm(slug) }); });
}
function speciesOf(name) {
  const t = String(name).replace(/\s+ex$/i, "").split(/\s+/);
  for (let len = t.length; len >= 1; len--) for (let i = 0; i + len <= t.length; i++) { const k = norm(t.slice(i, i + len).join(" ")); if (keyMap.has(k)) return keyMap.get(k); }
  return 0;
}
function indexSpecies() {
  keyMap = new Map(dex.map(d => [d.key, d.id])); spMap = new Map();
  const TW = /\b(bag|ball|cape|potion|helmet|scarf|band|charm|stone|fossil|orders?|research|machine|berry|gear|slab|flute|cloak|bell|shell|vest|glasses|ticket|incense|feather|cart|stadium|energy)\b/i;
  cards.forEach(c => { if (!c.type) c.poke = speciesOf(c.name) > 0 && !TW.test(c.name); if (!c.poke) return; const id = speciesOf(c.name); if (id) { c.sp = id; if (!spMap.has(id)) spMap.set(id, []); spMap.get(id).push(c); } });
}
const prog = d => { const l = spMap.get(d.id) || []; return { h: l.filter(c => owned.has(cid(c))).length, t: l.length }; };
const GSVG = { "♀": '<svg class="gs" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="5"/><path d="M12 14v8M8.5 18h7"/></svg>', "♂": '<svg class="gs" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="14" r="5"/><path d="M13.5 10.5L20 4M14.5 4H20v5.5"/></svg>' };
const escG = t => esc(t).replace(/[♀♂]/g, m => GSVG[m]);
function pkTile(d) {
  const p = prog(d);
  return '<button class="pk' + (p.t ? "" : " none") + (p.t && p.h === p.t ? " full" : "") + '" data-d="' + d.id + '">' + (fav.has(d.id) ? '<span class="hr">♥</span>' : "") +
    '<img loading="lazy" alt="" src="' + SPR[0](d.id) + '" data-d="' + d.id + '" data-t="0" onerror="sprErr(this)">' +

/* ручная отметка и счётчики в физической коллекции; переключатели выпадения */

  [id, String(v.dex)].forEach(x => { const r = document.getElementById("pxr-" + x), w = pxvById.get(x); if (r && w) r.outerHTML = pxRow(w); });

document.addEventListener("change", e => {
  const t = e.target; if (!t || !t.dataset) return;
  if (t.dataset.px) { const id = t.dataset.px; if (t.checked) pcnt.set(id, Math.max(1, pcnt.get(id) || 0)); else pcnt.delete(id); savePhys(); pxAfter(id); return; }
  if (t.dataset.pxc) { pcfg.cats[t.dataset.pxc] = t.checked ? 1 : 0; savePcfg(); pxRecalc(); draw(); return; }
  if (t.dataset.pxo) { if (t.checked) pxOff.delete(t.dataset.pxo); else pxOff.add(t.dataset.pxo); savePcfg(); pxRecalc();
    const r = t.closest(".pxrow"); if (r) r.classList.toggle("on", t.checked); const dp = $("#pxdprog"); if (dp) dp.innerHTML = "В выпадении " + pxOn.length + " из " + pxv.length + " вариантов" + meter(pxOn.length, pxv.length); return; }
});
document.addEventListener("click", e => {

  e.preventDefault();
  const id = b.dataset.pxp || b.dataset.pxm, n = (pcnt.get(id) || 0) + (b.dataset.pxp ? 1 : -1);

/* оверлей открытия пака: разрыв пака → 5 покемонов по одному → итог */

function pxShow() {

    const nn = r.fresh.filter(Boolean).length;
    ov.innerHTML = '<div class="pxsum"><h2>Твой ProDex</h2><div class="pxhint">' + (nn ? "Новых в физической коллекции: " + nn : "Все уже были в коллекции") + " · всего " + pxHaveN(pxv) + " / " + pxv.length + '</div><div class="pxfive">' + r.ids.map((id, i) => pxMini(id, r.fresh[i], i * .08)).join("") +
      '</div><div class="pxact"><button class="pxbtn" id="pxagain">Открыть ещё</button><button class="pxbtn sec" id="pxdone">Готово</button><button class="pxbtn sec" id="pxtophys2">Физическая коллекция</button></div></div>';

    '<div class="pxbig ' + v.rar + " v" + v.cat + '" id="pxnext">' + pxCatTag(v.rar) + (r.fresh[r.i] ? '<span class="pxnew">NEW</span>' : "") + pxImg(v, false) + '<div class="nm">' + escG(v.name) + "</div>" + pxVTag(v) + '<div class="no">#' + v.dex + "</div></div>" +
    '<div class="pxhint">' + (r.i < r.ids.length - 1 ? "Нажми, чтобы увидеть следующего" : "Нажми, чтобы увидеть итог") + "</div>";

function pxClose() { pxRun = null; const ov = $("#pxov"); ov.hidden = true; ov.innerHTML = ""; pxLock(false); if (tab === "pack") draw(); }
document.addEventListener("click", e => {
  const ov = $("#pxov"); if (!ov || ov.hidden || !ov.contains(e.target)) return;
  const r = pxRun, c = id => e.target.closest("#" + id);
  if (c("pxdone")) { pxClose(); return; }
  if (c("pxtophys2")) { pxClose(); st.pv = "phys"; if (tab !== "pack") tab = "pack"; build(); window.scrollTo(0, 0); return; }
  if (c("pxagain")) { pxStart(); return; }
  if (!r) return;
  if (c("pxskip")) { r.i = r.ids.length; pxShow(); return; }
  const tear = c("pxtear");
  if (tear && r.i < 0) { if (tear.classList.contains("go")) return; tear.classList.add("go"); setTimeout(() => { if (pxRun === r && r.i < 0) { r.i = 0; pxShow(); } }, 800); return; }

    if (g) g.textContent = alt.has(i) ? "★" : "";

  });

    const l = cf(), h = l.filter(c => owned.has(cid(c))).length;
    $("#prog").innerHTML = "Собрано " + h + " из " + l.length + meter(h, l.length);

    body.innerHTML = list.length ? list.slice(0, st.cl).map(c => tile(c, { star: true })).join("") + (list.length > st.cl ? '<button class="more" id="moreCards" style="grid-column:1/-1">Показать ещё (' + (list.length - st.cl) + ")</button>" : "") : '<p class="empty">Ничего не найдено</p>';
    body.className = "grid";
    const mb = $("#moreCards"); if (mb && typeof IntersectionObserver !== "undefined") { if (window.__io) window.__io.disconnect(); window.__io = new IntersectionObserver(en => { if (en[0].isIntersecting) { st.cl += 240; draw(); } }); window.__io.observe(mb); }
  } else if (tab === "species") {
    if (dex.length) {
      const list = dex.filter(d => {
        if (st.gen && d.gen !== +st.gen) return false;
        if (st.favOnly && !fav.has(d.id)) return false;
        if (q && !d.name.toLowerCase().includes(q) && String(d.id) !== q) return false;
        if (st.flt === "all") return true;
        const p = prog(d);
        return (st.flt === "have" && p.h > 0) || (st.flt === "none" && p.h === 0) || (st.flt === "miss" && p.t > 0 && p.h === 0) || (st.flt === "full" && p.t > 0 && p.h === p.t) || (st.flt === "tcg" && p.t > 0);
      });
      if (st.sort === "name") list.sort((a, b) => a.name.localeCompare(b.name));
      if (st.sort === "prog") { const r = d => { const p = prog(d); return p.t ? p.h / p.t : -1; }; list.sort((a, b) => r(b) - r(a) || a.id - b.id); }
      st.order = list.map(d => d.id);
      if (!list.length) { body.innerHTML = '<p class="empty">Ничего не найдено</p>'; return; }
      if (st.sort === "num" && !st.gen) {
        let out = "";
        for (let g = 1; g <= 9; g++) { const gl = list.filter(d => d.gen === g); if (gl.length) out += '<div class="gh">Поколение ' + g + "<span>" + gl.length + '</span></div><div class="dgrid">' + gl.map(pkTile).join("") + "</div>"; }
        body.innerHTML = out;
      } else body.innerHTML = '<div class="dgrid">' + list.map(pkTile).join("") + "</div>";
    }
  } else if (tab === "stats") {
    try { drawStats(body); } catch (e) { body.innerHTML = '<p class="empty">Не удалось построить статистику: ' + esc(String(e && e.message || e)) + "</p>"; }
  } else if (tab === "pack") {
    drawPack(body);
  } else {
    if (!Object.keys(MIS).length) { body.innerHTML = '<p class="empty">Миссии не загружены. Проверь, что файл missions.js лежит в репозитории рядом с index.html.</p>'; return; }
    const k = (st.mset || "").toLowerCase(), all = MIS[k] || [];
    const items = all.map((x, i) => ({ x, i, s: mst(k, x) })).filter(o => isSec(k, o.x) === st.secret);
    const active = items.filter(o => !o.s.done), fin = items.filter(o => o.s.done);
    const byId = new Map(cards.map(c => [cid(c), c]));
    const one = o => {
      const x = o.x, s = o.s, at = ' data-mk="' + k + '" data-mi="' + o.i + '"';
      let inner;
      if (x.manual) inner = x.need > 1 ? '<div class="mctl"><button' + at + ' data-a="-">−</button><b>' + s.h + " / " + s.t + "</b><button" + at + ' data-a="+">+</button></div>' :
        '<button class="fav' + (s.done ? " on" : "") + '"' + at + ' data-a="t">' + (s.done ? "✓ Выполнено" : "Отметить выполненной") + "</button>";
      else if (x.groups) inner = '<div class="grid">' + x.groups.map(g => {
        const r = reqOf(g), p = rprog(r), cs = p.cs;
        if (!cs.length) return "";
        if (cs.length === 1 && !r.f && !r.sl && !r.dx && p.t === 1 && !r.c) return tile(cs[0]);
        const parts = []; if (r.lb) parts.push(r.lb); else if (r.f) parts.push("любые " + fdesc(r.f) + " (" + cs.length + ")"); else if (r.sl) parts.push("разные карточки из списка"); else if (cs.length > 1) parts.push("любая из этих"); if (r.x) parts.push("кроме: " + r.x.join(", "));
        if (r.c) parts.push("нужно копий: " + p.t); else if (p.t > 1) parts.push("нужно разных: " + p.t);
        return '<div class="og"><div class="ol">' + (p.h >= p.t ? "✓ " : "") + esc(parts.join(" · ")) + " · " + p.h + " / " + p.t + '</div><div class="grid">' + cs.slice(0, 48).map(c => tile(c, { stp: !!r.c })).join("") + (cs.length > 48 ? '<p class="prog">…и ещё ' + (cs.length - 48) + "</p>" : "") + "</div></div>";
      }).join("") + "</div>";
      else if (x.filter) inner = '<p class="prog" style="margin:0">Считается автоматически по твоей коллекции. Подходящих карточек: ' + s.n + "</p>";
      else inner = '<div class="grid">' + x.cards.map(i => byId.get(i)).filter(Boolean).map(tile).join("") + "</div>";
      const col = foldOv[mid(k, x)] !== undefined ? foldOv[mid(k, x)] : true;
      return '<section class="grp' + (s.done ? " done" : "") + '"><h3 class="mh" data-fold="' + k + "|" + o.i + '"><span class="chev">' + (col ? "▸" : "▾") + '</span><span class="mt">' + (s.done ? "✓ " : "") + esc(x.title) + "</span><span>" + s.h + " / " + s.t + '</span></h3>' +
        (s.t > 1 ? meter(s.h, s.t) : "") +
        (col ? "" : (x.reward ? '<p class="prog" style="margin:6px 0 0">Награда: ' + esc(x.reward) + "</p>" : "") + (x.note ? '<p class="prog" style="margin:6px 0 0">' + esc(x.note) + "</p>" : "") + (x.guess ? '<p class="prog" style="margin:6px 0 0">⚠ Состав восстановлен по неполному тексту источника, сверь с игрой.</p>' : "") + '<div style="margin-top:10px">' + inner + "</div>") + "</section>";
    };
    body.innerHTML = items.length ? '<div class="prog">Выполнено миссий: ' + fin.length + " из " + items.length + " (" + pct(fin.length, items.length) + "%)" + meter(fin.length, items.length) + "</div>" +
      active.map(one).join("") + (fin.length ? '<div class="gh" style="font-size:17px">Выполнено <span>' + fin.length + "</span></div>" + fin.map(one).join("") : "") +
      '<p class="prog">В игре некоторые миссии засчитывают любую версию карты, поэтому сверяйся с самой миссией.</p>' :
      '<p class="empty">Для этого сета пока нет ' + (st.secret ? "секретных" : "обычных") + " миссий. Они хранятся в файле missions.js.</p>";
  }
}

document.addEventListener("keydown", e => { if (e.key === "Escape") { if (st.cardOpen) closeCard(); else if (st.open) closePk(); } });
document.addEventListener("click", e => {
  const ss = e.target.closest ? e.target.closest(".ssort button") : null;
  if (ss) { const bar = ss.parentElement, key = bar.dataset.sk; accSort[key] = ss.dataset.m; try { localStorage.setItem(ASKEY, JSON.stringify(accSort)); } catch (er) {} bar.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === ss)); if (bar.nextElementSibling) bar.nextElementSibling.innerHTML = rowsOf(key); return; }
  const sr = e.target.closest ? e.target.closest(".srow") : null;
  if (sr) { st.sscroll = window.scrollY || 0; openGrid(sr.dataset.set, sr.dataset.pack ? sr.dataset.set + "|" + sr.dataset.pack : ""); return; }
  const mv = e.target.closest("[data-mv]");
  const fd = !mv && e.target.closest("[data-fold]");
  if (fd) { const p = fd.dataset.fold.split("|"), x = MIS[p[0]][+p[1]], id = mid(p[0], x), cur = foldOv[id] !== undefined ? foldOv[id] : true; foldOv[id] = !cur; saveFold(); draw(); return; }
  if (mv) { const p = mv.dataset.mv.split("|"), x = MIS[p[0]][+p[1]]; secOv[mid(p[0], x)] = !isSec(p[0], x); saveSec(); draw(); return; }
  const mb = e.target.closest("[data-mk]");
  if (mb) { const k = mb.dataset.mk, x = MIS[k][+mb.dataset.mi], id = mid(k, x), a = mb.dataset.a, cur = +mstate[id] || 0, mx = x.need || 1; mstate[id] = a === "+" ? Math.min(cur + 1, mx) : a === "-" ? Math.max(0, cur - 1) : (cur ? 0 : 1); saveM(); draw(); return; }
  const pk = e.target.closest(".pk");
  if (pk) { openPk(+pk.dataset.d); return; }
  if (e.target.closest("#pvback")) { closePk(); return; }
  if (e.target.closest("#hrt")) { fav.has(st.open) ? fav.delete(st.open) : fav.add(st.open); saveFav(); renderPk(); return; }
  const sq = e.target.closest("[data-q]");
  if (sq) { const id = sq.closest(".card").dataset.id; setQty(id, qty(id) + (sq.dataset.q === "+" ? 1 : -1)); afterChange(id); return; }
  if (e.target.closest("#cvm")) { setQty(st.cardOpen, qty(st.cardOpen) - 1); afterChange(st.cardOpen); return; }
  if (e.target.closest("#cvp")) { setQty(st.cardOpen, qty(st.cardOpen) + 1); afterChange(st.cardOpen); return; }
  if (e.target.closest("#moreCards")) { st.cl += 240; draw(); return; }
  const ck = e.target.closest(".ck");
  if (ck) { toggleCard(ck.closest(".card").dataset.id); return; }
  if (e.target.closest("#cvback")) { closeCard(); return; }
  if (e.target.closest("#cvck")) { toggleCard(st.cardOpen); return; }
  if (e.target.closest("#cvw")) { toggleFlag(wish, st.cardOpen); return; }
  if (e.target.closest("#cva")) { toggleFlag(alt, st.cardOpen); return; }
  const b = e.target.closest(".card"); if (!b) return;
  openCard(b.dataset.id);
});
/* боковое меню разделов */
const SEC_T = { cards: "Карточки", species: "Покемоны", missions: "Миссии", stats: "Статистика", pack: "Pack" };
function navSync() {
  const pv = st.pv || "box";
  document.querySelectorAll("#nav [data-t]").forEach(x => {
    let on = x.dataset.t === tab;
    if (on && tab === "pack") on = x.dataset.pv ? x.dataset.pv === pv : pv === "box";
    x.classList.toggle("on", on);
  });
  const h = $("#secT"); if (h) h.textContent = SEC_T[tab] || "ProDex";
}
function drawer(open) {
  const d = $("#drw"); if (!d) return;
  d.classList.toggle("open", open); d.setAttribute("aria-hidden", open ? "false" : "true");
  $("#menuBtn").setAttribute("aria-expanded", open ? "true" : "false");
  document.body.classList.toggle("dopen", open);
  if (open) navSync();
}
$("#menuBtn").onclick = () => drawer(true);
$("#drw").onclick = e => {
  if (e.target.closest("[data-close]")) { drawer(false); return; }
  const b = e.target.closest("[data-t]"); if (!b) return;
  const t = b.dataset.t;
  if (t === "pack") st.pv = b.dataset.pv || (tab === "pack" ? st.pv : "box") || "box";
  if (tab !== t) st.limit = 30;
  tab = t;
  drawer(false);
  build();
  window.scrollTo(0, 0);
};
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#drw").classList.contains("open")) drawer(false); });

(async () => {
  const msg = t => { $("#main").innerHTML = '<p class="empty">' + t + "</p>"; };
  window.addEventListener("error", e => { if (!cards.length) msg("Ошибка в приложении: " + esc(e.message)); });
  try {
    const [c0, s0, slugs, pr0] = await Promise.all([getJson(BASE_URLS), getJson(SETS_URLS).catch(() => ({})), loadDex(), getJson(PR_URLS).catch(() => null), loadSetImgs()]);
    PR = pr0 && typeof pr0 === "object" && !Array.isArray(pr0) ? pr0 : null;
    cards = asArr(c0).map(x => Object.assign({}, x, { poke: x.type === "pokemon", packs: x.packs || [], inum: x.number, name: cleanName(x.name) }));
    dataFixes = [];
    asArr(c0).forEach((x, i) => { if (cards[i].name !== x.name) dataFixes.push([cards[i].set + " " + cards[i].number, x.name, cards[i].name]); });
    renumberNegatives();
    const sm = new Map();
    Object.values(s0 || {}).flat().forEach(x => { if (x && x.code && !sm.has(x.code)) sm.set(x.code, x); });
    sets = [...sm.values()].sort((a, b) => (b.releaseDate || "").localeCompare(a.releaseDate || ""));
    const known = new Set(sets.map(x => x.code));
    [...new Set(cards.map(x => x.set))].filter(x => !known.has(x)).forEach(code => sets.push({ code, name: { en: code } }));
    const si = new Map(sets.map((x, i) => [x.code, i]));
    cards.sort((a, b) => (si.has(a.set) ? si.get(a.set) : 999) - (si.has(b.set) ? si.get(b.set) : 999) || a.number - b.number);
    if (!cards.length) throw new Error("список карточек пуст");
    buildDex(slugs); indexSpecies(); buildMIS();
    buildPdx(await pdxReady); buildPxv(await pvReady);
    if (st.set && !sets.some(x => x.code === st.set)) st.set = "";
    if (st.mset && !sets.some(x => x.code === st.mset)) st.mset = "";
    if (st.set && !sets.some(x => x.code === st.set)) { st.set = ""; st.pack = ""; }
    if (st.pack && !sets.some(x => x.code === st.pack.split("|")[0])) st.pack = "";
    try { if (dataFixes.length) console.info("Автоисправления данных (сам файл не меняется):", dataFixes); } catch (e) {}
    navSync();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    const nw = sets.find(x => cards.some(c => c.set === x.code));
    build();
  } catch (e) {
    msg("Не удалось загрузить данные.<br><small>" + esc(e.message || e) + "</small><br>Проверь интернет и обнови страницу.");
  }
})();
</script>
